<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🇵🇭 FilipinoTV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />

  <!-- iPhone splash + icon -->
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="apple-touch-startup-image" href="images/splash-iphone.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loading-screen">
    <div class="loading-logo">🇵🇭</div>
    <div class="loading-text">Loading FilipinoTV…</div>
  </div>

  <header>
    <h1>🇵🇭 FilipinoTV</h1>
    <input
      type="text"
      id="search-input"
      placeholder="Search channels…"
      autocomplete="off"
    />
  </header>

  <main>
    <section id="channel-list"></section>
    <section id="player-section">
      <div id="now-playing">Now Playing: None</div>
      <video id="video-player" controls playsinline></video>
    </section>
  </main>

  <script src="streams.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("service-worker.js")
          .catch(console.error);
      });
    }
  </script>
</body>
</html>
